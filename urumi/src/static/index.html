<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Gantry Digital Twin</title>
    <style>
        body { margin: 0; padding: 20px; background-color: #1a1a1a; color: white; font-family: 'Inter', sans-serif; }
        .container { display: flex; flex-direction: column; align-items: center; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-box { background: #333; padding: 15px 25px; border-radius: 8px; font-size: 1.2rem; }
        .canvas-container { position: relative; border: 2px solid #555; border-radius: 4px; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gantry Digital Twin</h1>
        <div class="stats">
            <div class="stat-box">X: <span id="valX">0.00</span> mm</div>
            <div class="stat-box">Y: <span id="valY">0.00</span> mm</div>
        </div>
        <div class="canvas-container">
            <canvas id="bedCanvas" width="950" height="700"></canvas>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
